<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فروشگاه سرور علی کرفت</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #4b0082, #8a2be2, #4b0082);
            color: white;
            font-family: 'Tahoma', sans-serif;
            text-align: center;
        }
        h1 { font-size: 3rem; margin-bottom: 10px; text-shadow: 2px 2px 10px rgba(0,0,0,0.5); }
        .ip-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 30px;
            border-radius: 15px;
            font-size: 1.5rem;
            border: 2px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 40px;
            cursor: pointer;
        }
        .btn-bot {
            padding: 20px 40px;
            background: #f1c40f;
            color: black;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.2rem;
            border-radius: 50px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .btn-bot:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(241, 196, 15, 0.6);
        }
    </style>
</head>
<body>

    <h1>سرور علی کرفت</h1>
    <div class="ip-box">IP: ali.tgmc.ir</div>
    
    <a href="https://ble.ir/rankserverali_bot" class="btn-bot">خرید رنک و کیت (ربات بله)</a>

</body>
</html>
